<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>解析資料の共通テンプレート | スライド共有</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <script src="../../assets/deck.js" defer></script>
</head>
<body class="deck-page">
  <header class="deck-header">
    <a class="back-link" href="../../" aria-label="一覧に戻る">← <span>一覧</span></a>
    <span id="deck-title" class="deck-title">スライド</span>
    <button id="share-button" class="text-button" type="button">共有</button>
  </header>
  <main class="deck-main">
    <div id="slide" class="slide" aria-live="polite"></div>
  </main>
  <footer class="deck-footer">
    <button id="prev-button" class="nav-button" type="button" aria-label="前のスライド">←</button>
    <div class="deck-progress"><span id="counter">1 / 1</span><div id="progress-dots" class="progress-dots" aria-hidden="true"></div></div>
    <button id="next-button" class="nav-button" type="button" aria-label="次のスライド">→</button>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
